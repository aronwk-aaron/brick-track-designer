<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brick Track Designer</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #f4f4f2; --panel: #fbfbf9; --line: #ddd; --ink: #222; --muted: #666; --accent: #2b6fe0; --err: #c0392b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1f21; --panel: #25282b; --line: #3a3d40; --ink: #e6e6e3; --muted: #9a9a96; --accent: #6ea2ff; --err: #ff7a6b; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 330px 1fr; grid-template-rows: auto 1fr; height: 100vh; background: var(--bg); color: var(--ink); }
    header { grid-column: 1 / 3; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { font-size: 16px; margin: 0 12px 0 0; }
    header .gauge { display: flex; gap: 6px; align-items: center; }
    header .gauge input { width: 56px; }
    aside { overflow: auto; padding: 10px; border-right: 1px solid var(--line); background: var(--panel); }
    fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 10px; padding: 8px; }
    legend input.name { font-weight: 600; width: 140px; }
    .field { display: grid; grid-template-columns: 1fr 90px; gap: 6px; align-items: center; margin: 4px 0; }
    .field span { color: var(--muted); }
    .field input { width: 100%; }
    .seg { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 4px; }
    .seg .field { grid-column: 1; }
    .seg button { grid-column: 2; grid-row: 1 / span 2; }
    .row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    button, select { font: inherit; padding: 4px 8px; }
    main { display: grid; grid-template-rows: 1fr 1fr; min-height: 0; }
    .planbox { display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--line); }
    #plan { flex: 1; min-height: 0; background: #fbfbf8; padding: 6px; }
    #plan svg { width: 100%; height: 100%; display: block; }
    #view3d { min-height: 0; position: relative; }
    #view3d canvas { display: block; }
    #status { position: absolute; left: 10px; bottom: 8px; right: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
    #error { color: var(--err); }
    .legend { font-size: 12px; color: var(--muted); padding: 4px 10px; }
    .legend b { display: inline-block; width: 18px; height: 4px; vertical-align: middle; margin: 0 4px 0 10px; }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; } aside { max-height: 45vh; border-right: 0; } header { grid-column: 1; } }
  </style>
</head>
<body>
  <header>
    <h1>Brick Track Designer</h1>
    <select id="template"><option value="">Start from…</option></select>
    <button id="add-route" type="button">+ Route</button>
    <span class="gauge"><label for="gauge">Gauge (studs between rails)</label><input id="gauge" type="number" min="2" max="10" step="1"></span>
    <button id="export-stl" type="button">Download STL</button>
    <button id="save" type="button">Save design</button>
    <button id="load" type="button">Open design</button>
    <input id="load-file" type="file" accept=".json,application/json" hidden>
  </header>
  <aside id="routes"></aside>
  <main>
    <div class="planbox">
      <div class="legend">Plan: <b style="background:#4a5560"></b>rails <b style="background:#e0452b"></b>flangeway cut <b style="background:#2b6fe0"></b>check rails, circles = rail crossings, squares = points (not built yet)</div>
      <div id="plan"></div>
    </div>
    <div id="view3d"><div id="status"><span id="info"></span> <span id="error"></span></div></div>
  </main>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
